services:
  postgres:
    image: postgres:15-alpine
    container_name: task-service-db
    environment:
      POSTGRES_DB: task_service
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: task-service-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - task-service-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: task-service-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181


      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - task-service-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: task-service-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c '
        echo "Waiting for Kafka to be ready...";
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "Kafka is not ready yet, retrying in 5 seconds...";
          sleep 5;
        done;
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic task-events \
          --partitions 1 \
          --replication-factor 1;
        echo "Kafka topic task-events is ready.";
      '
    restart: "no"
    networks:
      - task-service-network

  task-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-service-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: task_service
      DB_USERNAME: task_user
      DB_PASSWORD: task_password

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TASK_EVENTS_TOPIC: task-events

      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - task-service-network

volumes:
  postgres_data:

networks:
  task-service-network:
    driver: bridge
